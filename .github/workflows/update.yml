name: update

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  doppio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate formula from latest stable release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "label=$(bin/update-doppio)" >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update ${{ steps.update.outputs.label }}"
          git push
